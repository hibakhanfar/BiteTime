[project]
name = "drf-skeleton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hiba Ibrahim Khanfar", email = "hibaibraheem140@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "django>=6.1",
    "django-celery-beat>=2.1.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "redis>=8.1.0",
]

[project.scripts]
drf-skeleton = "drf_skeleton:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint.per-file-ignores]
"core/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["core", "common"]
