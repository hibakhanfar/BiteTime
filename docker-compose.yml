services:
  redis:
    image: redis:alpine
    container_name: bitetime-redis
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: pgsty/minio:latest
    container_name: bitetime-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data:
